<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAAUN University - FAQ CHATBOT</title>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ===== RESET & VARIABLES ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #667eea;
      --secondary-color: #764ba2;
      --accent-color: #f093fb;
      --bg-light: #f8fafc;
      --bg-white: #ffffff;
      --text-dark: #1a202c;
      --text-light: #718096;
      --border-color: #e2e8f0;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
      --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.15);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --input-height: 60px;
      --faq-height: 130px;
      --total-bottom: calc(var(--input-height) + var(--faq-height) + 10px);
    }

    body.dark-mode {
      --bg-light: #0f1419;
      --bg-white: #1a202c;
      --text-dark: #f8fafc;
      --text-light: #cbd5e0;
      --border-color: #2d3748;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
      background: var(--bg-light);
      color: var(--text-dark);
    }

    body {
      overflow: hidden;
    }

    /* ===== MAIN CONTAINER ===== */
    .chat-wrapper {
      display: flex;
      height: 100vh;
      width: 100%;
      flex-direction: column;
      background: var(--bg-white);
      position: relative;
    }

    /* ===== HEADER ===== */
    .chat-header {
      padding: 16px 20px;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-md);
      flex-shrink: 0;
      z-index: 100;
    }

    .header-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      animation: iconBounce 2s infinite;
    }

    @keyframes iconBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .header-text h2 {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }

    .header-text p {
      font-size: 12px;
      opacity: 0.9;
      margin: 2px 0 0 0;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .header-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .header-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    /* ===== CHAT MESSAGES ===== */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
      margin-bottom: 0;
      padding-bottom: var(--total-bottom);
    }

    .chat-messages::-webkit-scrollbar {
      width: 8px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #cbd5e0;
      border-radius: 4px;
      transition: background 0.3s;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: #a0aec0;
    }

    body.dark-mode .chat-messages::-webkit-scrollbar-thumb {
      background: #4a5568;
    }

    .message {
      display: flex;
      gap: 10px;
      animation: slideInMessage 0.3s ease;
      margin-top: 4px;
    }

    @keyframes slideInMessage {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bot-message {
      justify-content: flex-start;
    }

    .user-message {
      justify-content: flex-end;
    }

    .message-content {
      padding: 12px 16px;
      border-radius: 16px;
      max-width: 70%;
      word-wrap: break-word;
      line-height: 1.5;
      font-size: 14px;
      animation: messageFloat 0.4s ease;
    }

    @keyframes messageFloat {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .bot-message .message-content {
      background: var(--bg-light);
      color: var(--text-dark);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .user-message .message-content {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      color: #fff;
      box-shadow: 0 4px 16px rgba(102, 126, 234, 0.35);
    }

    /* ===== BOTTOM CONTAINER (FAQ + INPUT) ===== */
    .bottom-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      background: var(--bg-white);
      z-index: 1000;
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
    }

    body.dark-mode .bottom-container {
      background: #1a202c;
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.4);
    }

    /* ===== FAQ BUTTONS SECTION ===== */
    .faq-section {
      padding: 14px 20px;
      background: var(--bg-white);
      border-top: 1px solid var(--border-color);
      flex-shrink: 0;
      max-height: var(--faq-height);
      overflow-y: auto;
      overflow-x: hidden;
      transition: var(--transition);
    }

    body.dark-mode .faq-section {
      background: #1a202c;
      border-top-color: #2d3748;
    }

    .faq-section::-webkit-scrollbar {
      height: 5px;
    }

    .faq-section::-webkit-scrollbar-track {
      background: transparent;
    }

    .faq-section::-webkit-scrollbar-thumb {
      background: #cbd5e0;
      border-radius: 3px;
    }

    body.dark-mode .faq-section::-webkit-scrollbar-thumb {
      background: #4a5568;
    }

    .faq-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: 10px;
      display: block;
      letter-spacing: 0.8px;
      padding: 0 4px;
    }

    .faq-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0;
      margin: 0;
    }

    .faq-btn {
      flex: 0 1 calc(50% - 4px);
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 20px;
      background: var(--bg-white);
      color: var(--primary-color);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      white-space: normal;
      text-align: center;
    }

    body.dark-mode .faq-btn {
      border-color: #4a5568;
      color: #a0aef6;
      background: #252535;
    }

    .faq-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      transition: left 0.4s ease;
      z-index: -1;
    }

    .faq-btn:hover::before {
      left: 0;
    }

    .faq-btn:hover {
      color: #fff;
      border-color: transparent;
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .faq-btn:active {
      transform: translateY(-1px);
    }

    /* ===== STICKY INPUT BAR ===== */
    .input-section {
      background: var(--bg-white);
      border-top: 1px solid var(--border-color);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      height: var(--input-height);
    }

    body.dark-mode .input-section {
      background: #1a202c;
      border-top-color: #2d3748;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg-light);
      border: 2px solid var(--border-color);
      border-radius: 28px;
      padding: 0 20px;
      transition: var(--transition);
      height: 48px;
      position: relative;
      overflow: hidden;
    }

    .input-wrapper::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary-color), var(--secondary-color), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .input-wrapper:focus-within::before {
      opacity: 1;
    }

    .input-wrapper:focus-within {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1), inset 0 0 12px rgba(102, 126, 234, 0.05);
      transform: scale(1.01);
    }

    .input-wrapper input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      padding: 0;
      font-size: 15px;
      color: var(--text-dark);
      font-weight: 500;
    }

    .input-wrapper input::placeholder {
      color: var(--text-light);
    }

    body.dark-mode .input-wrapper {
      background: #2d3748;
      border-color: #4a5568;
    }

    body.dark-mode .input-wrapper input {
      color: #f8fafc;
    }

    .send-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: var(--transition);
      box-shadow: var(--shadow-md);
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .send-btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .send-btn:active::after {
      width: 48px;
      height: 48px;
    }

    .send-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 28px rgba(102, 126, 234, 0.5);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    /* ===== TYPING INDICATOR ===== */
    .typing-indicator {
      display: flex;
      gap: 6px;
      padding: 12px 16px;
      background: var(--bg-light);
      border-radius: 18px;
      width: fit-content;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: var(--primary-color);
      border-radius: 50%;
      animation: typingAnimation 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typingAnimation {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.6;
      }
      30% {
        transform: translateY(-12px);
        opacity: 1;
      }
    }

    /* ===== TABLE STYLES ===== */
    .table-wrapper {
      overflow-x: auto;
      margin: 12px 0;
      border-radius: 14px;
      box-shadow: var(--shadow-sm);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 12px 10px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    th {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      color: #fff;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 12px;
    }

    tr {
      transition: background 0.3s ease;
    }

    tr:hover {
      background: var(--bg-light);
    }

    body.dark-mode tr:hover {
      background: #2d3748;
    }

    /* ===== DARK MODE ===== */
    body.dark-mode .chat-messages {
      background: #0f1419;
    }

    body.dark-mode .header-text p {
      opacity: 0.85;
    }

    /* ===== RESPONSIVE DESIGN ===== */
    @media (max-width: 768px) {
      :root {
        --faq-height: 120px;
        --total-bottom: calc(var(--input-height) + var(--faq-height) + 8px);
      }

      .chat-messages {
        padding: 16px 16px;
        padding-bottom: var(--total-bottom);
        gap: 10px;
      }

      .message-content {
        max-width: 80%;
        font-size: 13px;
        padding: 10px 14px;
      }

      .input-section {
        padding: 12px 16px;
        gap: 10px;
        height: 56px;
      }

      .input-wrapper {
        height: 44px;
        padding: 0 16px;
        border-radius: 24px;
      }

      .input-wrapper input {
        font-size: 14px;
      }

      .send-btn {
        width: 44px;
        height: 44px;
        font-size: 18px;
      }

      .faq-btn {
        flex: 0 1 calc(50% - 4px);
        padding: 9px 10px;
        font-size: 11px;
      }

      .header-text h2 {
        font-size: 16px;
      }

      .faq-section {
        padding: 12px 16px;
      }

      .faq-label {
        font-size: 10px;
        margin-bottom: 8px;
      }
    }

    @media (max-width: 480px) {
      :root {
        --faq-height: 110px;
        --input-height: 56px;
        --total-bottom: calc(var(--input-height) + var(--faq-height) + 6px);
      }

      .chat-wrapper {
        height: 100vh;
      }

      .chat-messages {
        padding: 12px 12px;
        padding-bottom: var(--total-bottom);
        gap: 8px;
      }

      .message-content {
        max-width: 85%;
        font-size: 13px;
        padding: 10px 12px;
      }

      .input-section {
        padding: 10px 12px;
        gap: 8px;
        height: 56px;
      }

      .input-wrapper {
        height: 42px;
        padding: 0 12px;
        border-radius: 22px;
      }

      .input-wrapper input {
        font-size: 13px;
      }

      .send-btn {
        width: 42px;
        height: 42px;
        font-size: 16px;
      }

      .header-content {
        gap: 10px;
      }

      .header-icon {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }

      .header-text h2 {
        font-size: 15px;
      }

      .header-text p {
        font-size: 11px;
      }

      .header-actions {
        gap: 6px;
      }

      .header-btn {
        padding: 6px 12px;
        font-size: 12px;
      }

      .faq-btn {
        flex: 1 1 100%;
        padding: 8px 12px;
        font-size: 11px;
      }

      .faq-section {
        padding: 10px 12px;
      }

      .faq-buttons {
        gap: 6px;
      }

      .faq-label {
        font-size: 9px;
        margin-bottom: 6px;
      }

      table {
        font-size: 11px;
      }

      th, td {
        padding: 8px 6px;
      }
    }

    @media (max-width: 360px) {
      .header-btn {
        display: none;
      }

      .message-content {
        max-width: 90%;
      }

      .header-text h2 {
        font-size: 14px;
      }

      .send-btn {
        width: 40px;
        height: 40px;
        font-size: 14px;
      }

      .header-icon {
        width: 36px;
        height: 36px;
        font-size: 18px;
      }
    }

    /* ===== UTILITIES ===== */
    .hidden {
      display: none;
    }

    .no-messages {
      text-align: center;
      color: var(--text-light);
      padding: 40px 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="chat-wrapper">
    
    <!-- HEADER -->
    <header class="chat-header">
      <div class="header-content">
        <div class="header-icon">
          <i class="fas fa-graduation-cap"></i>
        </div>
        <div class="header-text">
          <h2>MAAUN FAQ CHATBOT</h2>
          <p>Always ready to help</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="header-btn" onclick="toggleMode()" title="Toggle dark mode">
          <i class="fas fa-moon"></i>
          <span>Dark</span>
        </button>
      </div>
    </header>

    <!-- CHAT MESSAGES -->
    <div class="chat-messages" id="chatMessages">
      <div class="message bot-message">
        <div class="message-content">
          <strong> Welcome to MAAUN!</strong><br>
          I'm here to answer all your questions about admission, courses, fees, and more. Feel free to ask anything!
        </div>
      </div>
    </div>

    <!-- BOTTOM CONTAINER -->
    <div class="bottom-container">
      <!-- FAQ SECTION -->
      <div class="faq-section">
        <span class="faq-label"> Quick Questions:</span>
        <div class="faq-buttons" id="faqButtons"></div>
      </div>

      <!-- STICKY INPUT BAR -->
      <div class="input-section">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="userInput" 
            placeholder="Ask me anything..."
            autocomplete="off"
          >
        </div>
        <button class="send-btn" onclick="sendMessage()" title="Send message">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>

  </div>

  <script>
    /* DARK MODE TOGGLE */
    function toggleMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('maaun-dark-mode', document.body.classList.contains('dark-mode'));
    }

    // Load dark mode preference
    if (localStorage.getItem('maaun-dark-mode') === 'true') {
      document.body.classList.add('dark-mode');
    }

    /* ===== FAQ DATA ===== */
    const faqButtonsData = [
      { question: "School fees", answer: "fees" },
      { question: "How do I apply?", answer: "Fill the online form, Upload documents, Pay application fee, Submit and wait for response" },
      { question: "What courses offered?", answer: "ENTER THE DEPARTMENT NAME IN THE SEARCH BOX TO VIEW THE COURSES AVAILABLE IN THE DEPARTMANT....eg computing, nursing, health sciences, social management sciences, law, medicine, environmental science" },
      { question: "Accept international students?", answer: "Yes MAAUN accept student worldwide" }
    ];

    const hiddenFaqs = [
      { question: "nursing", answer: "Nursing science" },
      { question: "Health science", answer: "Bsc medical laboratory science (MBLs), Doctor of physiotherapy (DPT), Bsc Public health" },
      { question: "Computing", answer: "School of computing: Bsc cyber security, Bsc computer science, Bsc information technology, Bsc software engineering, information systems, Bsc data science" },
      { question: "law", answer: "LL.B LAW" },
      { question: "social and management science", answer: "Bsc Accounting, Bsc Business Administration, Bsc Human resources Management, Bsc Mass communication, Bsc Banking and finance, Bsc Economics, Bsc peace and conflict resolution, Bsc international relations" },
      { question: "Medicine", answer: "Bachelor of medicine, Bachelor of surgery" },
      { question: "Environmental science", answer: "Bsc Architecture, Bsc. quantity survey" },
      { question: "Does maaun offer postgraduate program?", answer: "Yes they offer: MSc, Phd" },
      { question: "How long are the degree programs", answer: "Bachelor degree: 4-6 years, Postgradute: 1-2 years" },
      { question: "what are the entry requirement for the university", answer: "At least 5 credit including Mathematics and english" },
      { question: "How do i check my admission status?", answer: "Log in to the official admission portal using your credentails and check your status" },
      { question: "Do i need WAEC or Neco to apply?", answer: "Yes O-level(WAEC/NECO) is required" },
      { question: "Do i need Jamb apply?", answer: "Yes Jamb required" },
      { question: "Hello", answer: "hey" },
      { question: "hello", answer: "hi" },
      { question: "hi", answer: "hello" },
      { question: "hey", answer: "hi" },
      { question: "How are you", answer: "Im doing great. Thanks for Asking how about you?" },
      { question: "fine", answer: "alright glad. how can i help you" },
      { question: "what is your name", answer: "im your university assistant chatbot" },
      { question: "who made you develop,answer", answer: "i was developed by Aliyu yunus muhammad to help student with information and support" },
      { question: "ok alright okay kk great", answer: "yh" },
      { question: "bye", answer: "goodbye" },
      { question: "good morning", answer: "good morning how was your night" },
      { question: "good night", answer: "sleep well" },
      { question: "thank you", answer: "youre welcome" },
      { question: "i am bored", answer: "maybe try going for a walk" },
      { question: "location", answer: "School is located at kano" },
      { question: "history about", answer: "Maryam abacha american university of nigeria MAAUN is a private university located at kano. The university was founded in 2021 by professor Adamu Abubakar Gwarzo. It was created inresponses to nigerian goverment call for private sector to help expand access to higher education in the country" },
      { question: "contact phone number", answer: "+2348023658213, +2348023170586" },
      { question: "portal link", answer: "maaun.edu.ng" },
      { question: "president", answer: "Prof. (Dr.) Mohammad Israr" },
      { question: "founder", answer: "Prof Adamu abubakar gwarzo" },
      { question: "reslut", answer: "check your result at student portal" },
      { question: "hard", answer: "hhh no if your seriour with your studys" },
      { question: "sport", answer: "football, basketball, tabletennis, gym" },
      { question: "exam test", answer: "check the school calender" }
    ];

    /* COMBINE DATA */
    const fuse = new Fuse([...faqButtonsData, ...hiddenFaqs], {
      keys: ["question"],
      threshold: 0.4
    });

    /* SCHOOL FEES TABLE */
    const schoolFeesTable = `
      <div class="table-wrapper">
        <table>
          <thead>

    /* DOM ELEMENTS */
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const faqButtons = document.getElementById('faqButtons');

    /* ADD MESSAGE */
    function addMessage(text, isUser = false) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.innerHTML = text;
      
      messageDiv.appendChild(contentDiv);
      chatMessages.appendChild(messageDiv);
      
      // Scroll with a slight delay to ensure proper rendering
      setTimeout(() => {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, 50);
      
      return messageDiv;
    }

    /* TYPING INDICATOR */
    function showTypingIndicator() {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message bot-message';
      
      const typingDiv = document.createElement('div');
      typingDiv.className = 'typing-indicator';
      typingDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      
      messageDiv.appendChild(typingDiv);
      messageDiv.id = 'typing-indicator';
      chatMessages.appendChild(messageDiv);
      
      setTimeout(() => {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, 50);
    }

    function removeTypingIndicator() {
      const typingIndicator = document.getElementById('typing-indicator');
      if (typingIndicator) {
        typingIndicator.remove();
      }
    }

    /* SEND MESSAGE */
    function sendMessage(textFromBtn = null) {
      const text = textFromBtn || userInput.value.trim();
      if (!text) return;

      addMessage(text, true);
      userInput.value = '';
      userInput.focus();

      const lower = text.toLowerCase();

      // Show typing indicator
      showTypingIndicator();

      // Simulate typing delay
      setTimeout(() => {
        removeTypingIndicator();

        if (lower.includes('fees')) {
          addMessage(schoolFeesTable, false);
          return;
        }

        const result = fuse.search(text);
        let answer = "😊 Sorry, I don't have information about that. Try asking about courses, admission, fees, contact details!";
        if (result.length > 0) {
          answer = result[0].item.answer;
        }

        addMessage(answer, false);
      }, 1200);
    }

    /* ENTER KEY */
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    /* POPULATE FAQ BUTTONS */
    faqButtonsData.forEach((faq) => {
      const btn = document.createElement('button');
      btn.className = 'faq-btn';
      btn.textContent = faq.question;
      btn.onclick = () => sendMessage(faq.question);
      faqButtons.appendChild(btn);
    });

    // Auto-focus input on load
    window.addEventListener('load', () => {
      userInput.focus();
    });
  </script>
